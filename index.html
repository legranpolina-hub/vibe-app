<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>VIBE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* воздушная палитра: ледяное небо, белые арки, жемчуг, глубокий navy */
    --milk: #fbfcf1;
    --white: #ffffff;
    --bg: #e9f0f7;
    --surface: #f8fbfe;
    --sky: #c9ddf1;
    --sky-2: #a9c6e6;
    --teal: #d6e6f5;
    --sky-deep: #2b7fd8;
    --sky-ink: #0b1b3f;
    --navy: #0b1b3f;
    --ink: #0b1b3f;
    --ink-2: #3f4a60;
    --ink-3: #7b879b;
    --line: rgba(22, 27, 36, .07);
    --hot: #7b93c9;
    --ok: #5fae8c;

    --out: 0 14px 32px rgba(60, 92, 140, .18), 0 2px 6px rgba(60, 92, 140, .08), inset 0 1px 0 #fff;
    --out-sm: 0 8px 18px rgba(60, 92, 140, .16), 0 1px 3px rgba(60, 92, 140, .08), inset 0 1px 0 #fff;
    --in: inset 3px 3px 8px rgba(110, 138, 180, .32), inset -3px -3px 8px rgba(255, 255, 255, .9);
    /* жемчуг — выбранные состояния */
    --pearl: linear-gradient(180deg, #f2faff 0%, #d6eefb 50%, #bfe3f7 100%);
    --pearl-shadow: inset 0 1px 1px #fff, inset 0 -3px 8px rgba(69, 173, 230, .22), 0 0 0 1.5px rgba(108, 196, 238, .55), 0 8px 20px rgba(69, 173, 230, .25);
    /* главные кнопки: чистый ледяной голубой градиент, как свечение сферы */
    /* горизонтальный голубой градиент, как «пошаговый план»; при наведении уезжает в более глубокий тон */
    --gloss: linear-gradient(90deg, #78c9ff 0%, #87d2ff 50%, #96ddff 100%);
    --gloss-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), 0 10px 24px rgba(110, 190, 250, .45);
    --gloss-shadow-hover: inset 0 1px 0 rgba(255, 255, 255, .4), 0 14px 30px rgba(43, 127, 216, .5);
    --teal-fill: linear-gradient(90deg, #a9c6e6, #d6e6f5 60%, #ffffff);

    --display: "Manrope", "Helvetica Neue", Arial, sans-serif;
    --text: "Manrope", "Helvetica Neue", Arial, system-ui, sans-serif;
    --r: 28px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: var(--text); color: var(--ink); background: var(--bg);
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  button, input { font: inherit; color: inherit; }
  button { border: 0; background: none; padding: 0; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--sky-deep); outline-offset: 3px; }
  svg.i { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* фон как на референсе: морозное небо, снежные дюны, вода с отражением, ледяная сфера */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
  .sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .orb-bg {
    position: absolute; right: -70px; top: 44%; width: 240px; height: 240px; border-radius: 50%;
    background:
      radial-gradient(circle at 34% 30%, rgba(255,255,255,.98) 0 10%, rgba(255,255,255,.55) 24%, transparent 46%),
      radial-gradient(circle at 58% 56%, rgba(120,214,240,.85) 0%, rgba(150,196,236,.55) 22%, rgba(214,228,246,.5) 48%, rgba(248,251,255,.9) 76%);
    box-shadow: inset -18px -22px 40px rgba(130,160,214,.45), inset 10px 10px 30px rgba(255,255,255,.9), 0 40px 60px -30px rgba(120,150,200,.45);
    animation: float 9s ease-in-out infinite; opacity: .75;
  }
  .orb-bg::after {
    content: ""; position: absolute; left: 8%; right: 8%; top: 108%; height: 70%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(200,222,246,.7), rgba(200,222,246,0)); filter: blur(10px); opacity: .8;
  }
  @keyframes float { 50% { transform: translateY(-12px); } }
  .wrap {
    position: relative; z-index: 1; max-width: 460px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom));
  }
  .wrap.no-nav { padding-bottom: calc(120px + env(safe-area-inset-bottom)); }

  /* ---------- базовые элементы ---------- */
  .neu { background: var(--surface); box-shadow: var(--out); border-radius: var(--r); }
  .neu-in { background: var(--bg); box-shadow: var(--in); border-radius: var(--r); }
  .glass {
    background: rgba(255, 255, 255, .84);
    -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid #ffffff;
    box-shadow: 0 22px 48px rgba(50, 84, 134, .2), 0 2px 8px rgba(50, 84, 134, .08), inset 0 1px 0 #fff;
    border-radius: 30px;
  }
  /* кнопка переливается: градиент медленно течёт + пробегает блик; при наведении — светлый сиренево-розовый */
  .gloss {
    position: relative; overflow: hidden; isolation: isolate;
    background: var(--gloss);
    box-shadow: var(--gloss-shadow); color: #fff; text-shadow: 0 1px 2px rgba(40, 120, 190, .25);
    transition: box-shadow .35s ease, transform .15s ease;
  }
  .gloss::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; opacity: 0;
    background: linear-gradient(90deg, #a18af0 0%, #c49cee 50%, #ec9fd2 100%); background-size: 220% 100%;
    animation: flow 6s ease-in-out infinite; transition: opacity .45s ease;
  }
  .gloss::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none; border-radius: inherit;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.55), transparent);
    animation: shine 3.6s ease-in-out infinite;
  }
  @keyframes flow { 0%, 100% { background-position: 100% 0; } 50% { background-position: 0 0; } }
  @keyframes shine { 0% { left: -60%; } 55%, 100% { left: 130%; } }
  @media (hover: hover) { .gloss:hover { box-shadow: 0 14px 32px rgba(190, 150, 240, .5), inset 0 1px 0 rgba(255,255,255,.5); } .gloss:hover::before { opacity: 1; } }
  .gloss:active { box-shadow: 0 14px 32px rgba(190, 150, 240, .5); }
  .gloss:active::before { opacity: 1; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .h-display { font-family: var(--display); font-weight: 800; letter-spacing: -.03em; line-height: 1.08; text-wrap: balance; margin: 0; }
  .muted { color: var(--ink-2); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .stack { display: grid; gap: 14px; }
  .sec { margin-top: 28px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px; }
  .sec-head h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .sec-head button { font-size: 13px; font-weight: 600; color: var(--sky-deep); }

  .round {
    width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    background: var(--surface); box-shadow: var(--out-sm); color: var(--ink);
  }
  .round:active, .chip:active, .tile:active, .btn:active { transform: scale(.97); }
  .pill {
    display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600; background: rgba(255,255,255,.6); box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
    border: 1px solid rgba(255,255,255,.8);
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center;
    font-family: var(--display); font-size: 15px; color: var(--sky-ink);
    background: var(--surface); box-shadow: var(--out-sm);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 -18px; padding: 6px 18px 14px; scrollbar-width: none; }
  .chips.scroll::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 44px; padding: 0 18px; border-radius: 999px; font-size: 15px; font-weight: 700;
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); box-shadow: var(--out-sm); color: var(--ink); transition: transform .15s;
  }
  .chip.on { background: var(--pearl); box-shadow: var(--pearl-shadow); color: var(--navy); }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tile {
    height: 84px; border-radius: 20px; display: grid; place-items: center; align-content: center; gap: 8px;
    background: var(--surface); box-shadow: var(--out-sm); font-size: 13px; font-weight: 700; color: var(--ink);
    transition: transform .15s;
  }
  .tile svg.i { width: 24px; height: 24px; }
  .tile.on { box-shadow: var(--in); color: var(--sky-deep); background: var(--bg); }

  .btn {
    height: 58px; border-radius: 999px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 16px; font-weight: 700; letter-spacing: .01em; transition: transform .15s, opacity .2s;
  }
  .btn.gloss { color: #fff; letter-spacing: .01em; }
  .btn.soft { background: var(--surface); box-shadow: var(--out-sm); color: var(--ink); }
  .btn[disabled] { opacity: .45; pointer-events: none; }
  .link { font-size: 13px; font-weight: 600; color: var(--sky-deep); display: inline-flex; align-items: center; gap: 4px; }

  /* картинка места: мягкая абстракция в тонах места */
  .art { position: relative; overflow: hidden; background-size: cover; background-position: center; }
  .art svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- главный экран ---------- */
  .top { display: flex; align-items: center; gap: 10px; }
  .top .hello { margin-right: auto; }
  .hello small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .hello b { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .12em; }

  .hero { margin-top: 22px; padding: 22px 20px 20px; }
  .hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .hero h1 { font-size: 42px; line-height: 1; }
  .hero p { margin: 10px 0 18px; font-size: 15px; line-height: 1.45; color: var(--ink-2); max-width: 32ch; }
  .btn.big { height: 68px; font-size: 19px; font-weight: 800; letter-spacing: .01em; }
  .btn.big svg.i { width: 22px; height: 22px; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter {
    display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; border-radius: 20px; text-align: left;
    background: var(--surface); box-shadow: var(--out-sm);
  }
  .filter small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
  .filter b { font-size: 15px; font-weight: 700; }
  .filter > svg.i { color: var(--ink-3); width: 16px; height: 16px; transform: rotate(90deg); }

  /* слайдер «Удиви меня» — глянцевый тумблер */
  /* дорожка голубая и переливается; чем дальше тянешь сферу вправо, тем сильнее проступает сиренево-розовый */
  .slide {
    position: relative; height: 70px; border-radius: 999px; overflow: hidden; touch-action: none; user-select: none; cursor: pointer;
    background: var(--gloss); box-shadow: var(--gloss-shadow);
  }
  .slide .tint {
    position: absolute; inset: 0; border-radius: inherit; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, #a18af0 0%, #c49cee 50%, #ec9fd2 100%);
  }
  .slide .tint.back { transition: opacity .35s ease; }
  .slide::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 45%; pointer-events: none;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.6), transparent);
    animation: shine 3.6s ease-in-out infinite;
  }
  .slide .label {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 50px;
    color: #fff; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: .01em; pointer-events: none;
    text-shadow: 0 1px 2px rgba(40, 120, 190, .25);
  }
  .slide .label span { opacity: .75; margin-left: 8px; animation: nudge 1.8s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateX(5px); opacity: 1; } }
  .knob {
    position: absolute; top: 5px; left: 5px; width: 60px; height: 60px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #ffffff 0 18%, rgba(255,255,255,.6) 30%, transparent 55%),
      radial-gradient(circle at 60% 65%, #bcd6f0 0%, #e3eefa 45%, #f7fbff 75%);
    box-shadow: 0 8px 18px rgba(92, 124, 176, .35), inset -4px -6px 12px rgba(140, 170, 214, .45), inset 3px 3px 6px rgba(255,255,255,.9);
    display: flex; align-items: center; justify-content: center; gap: 4px; cursor: grab;
  }
  .knob i { display: none; }
  .knob.back { transition: transform .35s cubic-bezier(.2,.9,.3,1.2); }
  .quota { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--hot); }
  .dots i.off { background: rgba(27,38,51,.12); }

  .plan-card { display: flex; align-items: center; gap: 16px; padding: 18px; }
  .plan-card .ico { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--bg); box-shadow: var(--in); color: var(--sky-deep); flex: none; }
  .plan-card .ico svg.i { width: 26px; height: 26px; }
  .plan-card b { display: block; font-size: 16px; }
  .plan-card small { display: block; margin-top: 4px; font-size: 12px; color: var(--ink-2); font-weight: 500; }
  .plan-card .go { margin-left: auto; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; }

  .hscroll { display: flex; gap: 14px; overflow-x: auto; margin: 0 -18px; padding: 6px 18px 18px; scrollbar-width: none; }
  .hscroll::-webkit-scrollbar { display: none; }
  .pcard-s { flex: none; width: 176px; text-align: left; padding: 8px; border-radius: 24px; }
  .pcard-s .art { height: 124px; border-radius: 18px; }
  .pcard-s .t { padding: 10px 6px 4px; }
  .pcard-s b { display: block; font-size: 14px; line-height: 1.3; min-height: 36px; }
  .pcard-s small { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
  .pcard-s small svg.i { width: 14px; height: 14px; }
  .state {
    position: absolute; left: 10px; top: 10px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border-radius: 999px; font-size: 11px; font-weight: 700; background: rgba(255,255,255,.8);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .state::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  .state.closed::before { background: var(--hot); }

  /* ---------- нижняя навигация ---------- */
  .nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 20;
    width: min(420px, calc(100% - 32px)); height: 70px; padding: 8px; border-radius: 999px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    background: rgba(233, 236, 240, .85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    box-shadow: 0 14px 34px rgba(90, 110, 140, .22), inset 0 1px 0 #fff; border: 1px solid rgba(255,255,255,.8);
  }
  .nav button { border-radius: 999px; display: grid; place-items: center; align-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .nav button.on { background: var(--pearl); box-shadow: var(--pearl-shadow); color: var(--navy); }

  /* ---------- шапка подэкрана ---------- */
  .subhead { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .subhead .ttl { flex: 1; text-align: center; font-weight: 700; font-size: 15px; }
  .subhead .sp { width: 46px; }
  .progress { height: 8px; border-radius: 999px; background: var(--bg); box-shadow: var(--in); overflow: hidden; margin-bottom: 26px; }
  .progress i { display: block; height: 100%; border-radius: 999px; background: var(--teal-fill); box-shadow: 0 0 10px rgba(143,208,205,.6); transition: width .4s; }
  .q { margin: 26px 4px 12px; font-size: 16px; font-weight: 700; }

  .field {
    display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px; border-radius: 20px;
    background: var(--bg); box-shadow: var(--in); color: var(--ink-3);
  }
  .field input { border: 0; outline: 0; background: none; flex: 1; min-width: 0; font-size: 15px; color: var(--ink); }
  .field input::placeholder { color: var(--ink-3); }

  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(180deg, rgba(230,233,237,0), var(--bg) 30%);
  }
  .bottom-bar .in { max-width: 424px; margin: 0 auto; display: flex; gap: 12px; }
  .bottom-bar .btn.soft { width: 120px; flex: none; }

  /* карта-схема старта */
  /* карта: матовое стекло, настоящая Москва-река, Садовое кольцо тонкой линией, светящиеся точки и сфера-пин */
  .map {
    position: relative; height: 260px; border-radius: 30px; overflow: hidden;
    background:
      radial-gradient(70% 60% at 20% 15%, rgba(255,255,255,.95), transparent 60%),
      radial-gradient(60% 70% at 90% 100%, rgba(199,184,245,.35), transparent 65%),
      linear-gradient(160deg, #f6faff 0%, #e6eff9 55%, #dde8f5 100%);
    border: 1px solid #fff; box-shadow: var(--out);
  }
  .map svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .lbl {
    position: absolute; transform: translate(-50%, -50%); font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(22, 40, 80, .38); white-space: nowrap; pointer-events: none; transition: color .3s;
  }
  .map .lbl.on { color: var(--ink); }
  .map .dot {
    position: absolute; width: 7px; height: 7px; border-radius: 50%; transform: translate(-50%, -50%);
    background: #fff; box-shadow: 0 0 0 3px rgba(111, 176, 236, .22), 0 0 10px rgba(111, 176, 236, .8);
  }
  .map .pin {
    position: absolute; width: 26px; height: 26px; border-radius: 50%; transform: translate(-50%, -50%);
    transition: left .5s cubic-bezier(.2,.9,.3,1.15), top .5s cubic-bezier(.2,.9,.3,1.15);
    background: radial-gradient(circle at 34% 30%, #fff 0 16%, rgba(255,255,255,.4) 30%, transparent 50%),
      radial-gradient(circle at 60% 60%, #6fb0ec, #a9d4f5 55%, #eef6ff 90%);
    box-shadow: 0 6px 14px rgba(43, 127, 216, .45), inset -3px -4px 8px rgba(40, 110, 190, .35);
  }
  .map .pin::before, .map .pin::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid rgba(111, 176, 236, .55);
    animation: pulse 2.4s ease-out infinite;
  }
  .map .pin::after { animation-delay: 1.2s; }
  @keyframes pulse { from { transform: scale(.6); opacity: 1; } to { transform: scale(3.2); opacity: 0; } }
  .map .locate { position: absolute; right: 12px; top: 12px; }
  .map .legend { position: absolute; left: 14px; bottom: 12px; display: flex; gap: 12px; font-size: 10px; font-weight: 600; color: var(--ink-2); }
  .map .legend i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: #fff; box-shadow: 0 0 6px rgba(111,176,236,.9); vertical-align: 1px; }

  .stepper { display: flex; align-items: center; justify-content: space-between; padding: 10px; }
  .stepper b { font-family: var(--display); font-weight: 400; font-size: 30px; }

  /* ---------- экран места ---------- */
  .place-art { height: 360px; margin: 0 -18px; border-radius: 0 0 36px 36px; }
  .gal { position: relative; overflow: hidden; }
  .gal-track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .gal-track::-webkit-scrollbar { display: none; }
  .gal-slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; background-size: cover; background-position: center; }
  .gal-dots { position: absolute; left: 0; right: 0; bottom: 76px; display: flex; justify-content: center; gap: 6px; pointer-events: none; }
  .gal-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: width .25s, background .25s; }
  .gal-dots i.on { width: 20px; border-radius: 4px; background: #fff; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }

  }

  .toast {
    position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 80; transform: translate(-50%, 20px); opacity: 0;

  .fallback { margin-top: 24vh; padding: 30px 24px; text-align: center; }

  .skeleton { height: 14px; border-radius: 8px; background: rgba(255,255,255,.7); margin: 12px 0; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .45; } }

  .screen { animation: rise .35s cubic-bezier(.2,.9,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ================= сборка маршрута ================= */
  function buildRoute(plan, exclude) {
    var L = locObj(), bud = byId(D.budgets, plan.budget), max = bud ? bud.max : null;
    var tries = [
      { moods: plan.moods, company: plan.company, time: plan.time, max: max, q: plan.q },
      { moods: plan.moods, company: plan.company, time: plan.time, max: max },
      { moods: plan.moods, time: plan.time, max: max },
      { moods: plan.moods, max: max },
      { moods: plan.moods },
      {}
    ];
    function ok(p) { return !exclude || exclude.indexOf(p.id) < 0; }
    var pool = [], relaxed = false, hits = [], note = "";
    if (plan.q) {
      // сначала ищем строго по пожеланию, постепенно ослабляя остальные фильтры, но не само пожелание
      var qTries = [
        { moods: plan.moods, company: plan.company, time: plan.time, max: max, q: plan.q },
        { company: plan.company, max: max, q: plan.q },
        { max: max, q: plan.q },
        { q: plan.q }
      ];
      for (var j = 0; j < qTries.length; j++) {
        hits = D.places.filter(function (p) { return fits(p, qTries[j]) && ok(p); });
        if (hits.length) { if (j > 1) note = "По запросу «" + plan.q + "» нашли места, но не под все фильтры"; break; }
      }
      if (!hits.length) note = "По запросу «" + plan.q + "» пока ничего нет, собрали по настроению";
    }
    for (var i = 1; i < tries.length; i++) {
      pool = D.places.filter(function (p) { return fits(p, tries[i]) && ok(p) && hits.indexOf(p) < 0; });
      if (pool.length + hits.length >= Math.min(plan.count, 2)) { relaxed = i > 2 && !hits.length; break; }
    }
    if (hits.length && hits.length < plan.count && !note) note = "По запросу «" + plan.q + "» нашли " + hits.length + ", добавили ещё места рядом";
    if (hits.length >= plan.count) pool = [];
    // перемешиваем, чтобы «Собрать другой» давал новый вариант
    hits = hits.sort(function () { return Math.random() - .5; });
    pool = pool.sort(function () { return Math.random() - .5; });
    var start = Math.ceil((nowMin() + 10) / 5) * 5, stops = [], cur = L, t = start, used = [];
    var cand = hits.concat(pool);
    while (stops.length < plan.count && cand.length) {
      var best = null, bs = 1e9;
      cand.forEach(function (p) {
        if (used.indexOf(p.id) >= 0) return;
        // места под пожелание всегда в приоритете
        var tr = travel(cur, p), score = tr.min + (openInfo(p, t + tr.min).open ? 0 : 400) + Math.random() * 8 - (hits.indexOf(p) >= 0 ? 1000 : 0);
        if (score < bs) { bs = score; best = p; }
      });
      if (!best) break;
      var leg = travel(cur, best);
      t += leg.min;
      stops.push({ id: best.id, arrive: t, leg: leg, hit: hits.indexOf(best) >= 0 });
      t += best.stay; used.push(best.id); cur = best;
    }
    if (plan.finish === "home" && stops.length > 2) {
      // последним ставим пункт, ближайший к старту, и пересчитываем тайминг
      var tail = stops.slice(1).sort(function (a, b) { return dist(L, place(b.id)) - dist(L, place(a.id)); });
      stops = [stops[0]].concat(tail);
      var tmp = { loc: S.loc, start: start, stops: stops }; recalc(tmp); t = tmp.end;
    }
    var end = plan.endBy < start ? plan.endBy + 1440 : plan.endBy, cut = false;
    while (stops.length > 1 && t > end) {
      // сначала убираем места не по запросу; места по запросу — только если их больше одного
      var k = stops.length - 1; while (k > 0 && stops[k].hit) k--;
      if (stops[k].hit || k === 0) { if (stops.filter(function (x) { return x.hit; }).length <= 1 && stops.length <= 2) break; k = stops.length - 1; }
      stops.splice(k, 1); var tmp2 = { loc: S.loc, start: start, stops: stops }; recalc(tmp2); t = tmp2.end; cut = true;
    }
    var totalKm = stops.reduce(function (s, x) { return s + x.leg.km; }, 0);
    return { id: "r" + Date.now(), created: Date.now(), plan: JSON.parse(JSON.stringify(plan)), loc: S.loc, start: start, end: t, stops: stops, km: totalKm, relaxed: relaxed, cut: cut, note: note };
  }
  function recalc(r) {
    var cur = byId(D.districts, r.loc) || locObj(), t = r.start;
    r.stops.forEach(function (s) { var p = place(s.id); s.leg = travel(cur, p); t += s.leg.min; s.arrive = t; t += p.stay; cur = p; });
    r.end = t; r.km = r.stops.reduce(function (s, x) { return s + x.leg.km; }, 0);
  }
  function build() {
    if (leftR() <= 0) { haptic("warning"); paywall("Бесплатный маршрут на сегодня уже собран."); return; }
    spend("r");
    var ov = $("overlay");
    ov.innerHTML = '<div class="loader"><div class="orb"></div><h2>Собираем вечер<br>под твоё настроение</h2><p>Смотрим, что открыто и как удобнее дойти</p></div>';
    ov.classList.add("show");
    setTimeout(function () { ov.classList.remove("show"); S.route = buildRoute(S.plan); haptic("success"); go("route"); }, 1700);
  }

    return '' +

        '<button class="pill" data-act="shareRoute">' + ic("share") + ' Поделиться</button></div>' +
      '</section>' +
      (r.note ? '<div class="note" style="margin:-10px 0 18px">' + esc(r.note) + '</div>' : r.relaxed ? '<div class="note" style="margin:-10px 0 18px">Под все фильтры мест не хватило, добавили похожие</div>' : "") +
      (r.cut ? '<div class="note" style="margin:-10px 0 18px">Чтобы успеть к ' + hhmm(S.route.plan.endBy) + ', оставили ' + r.stops.length + " " + plural(r.stops.length, "место", "места", "мест") + '</div>' : "") +
      '<div class="tl">' + items + '</div>';
  }
  function swap(i) {
    var r = S.route, ex = r.stops.map(function (s) { return s.id; });
    var bud = byId(D.budgets, r.plan.budget);
    var pool = r.plan.q ? D.places.filter(function (p) { return ex.indexOf(p.id) < 0 && fits(p, { q: r.plan.q }); }) : [];
    if (!pool.length) pool = D.places.filter(function (p) { return ex.indexOf(p.id) < 0 && fits(p, { moods: r.plan.moods, max: bud ? bud.max : null }); });
    if (!pool.length) pool = D.places.filter(function (p) { return ex.indexOf(p.id) < 0; });
    if (!pool.length) { toast("Больше нечем заменить"); return; }
    var prev = i ? place(r.stops[i - 1].id) : locObj();
    pool.sort(function (a, b) { return travel(prev, a).min - travel(prev, b).min; });
    r.stops[i].id = pool[Math.floor(Math.random() * Math.min(3, pool.length))].id;
    recalc(r); haptic("light"); render();
  }

      case "toPlan3": go("plan3"); break;
      case "build": build(); break;
      case "rebuild": S.route = buildRoute(S.route.plan); haptic("light"); render(); toast("Собрали другой вариант"); break;
      case "saveRoute":
        var ix = -1; S.routes.forEach(function (x, i) { if (x.id === S.route.id) ix = i; });
        if (ix >= 0) { S.routes.splice(ix, 1); toast("Маршрут убран из избранного"); } else { S.routes.push(S.route); toast("Маршрут сохранён"); }
        store.set("routes", S.routes); haptic("light"); render(); break;
      case "shareRoute": shareRoute(S.route); break;
      case "start": S.active = { route: S.route, i: 0 }; go("active"); break;
      case "here": here(); break;
      case "routeToCur": routeSheet(place(S.active.route.stops[S.active.i].id)); break;
      case "stopActive": S.history = []; go("home", false); break;
      case "shareDone": shareRoute(S.active.route); break;
      case "routeTo": routeSheet(S.current); break;
      case "another": another(); break;
      case "save": toggleSave(S.current.id); render(); break;
      case "invite": invite(S.current); break;
      case "surprise": haptic("medium"); surprise(); break;
      case "pickBudget": optSheet("Бюджет", "Сколько готова потратить на человека", D.budgets, S.budget, "budget"); break;
      case "pickCompany": optSheet("С кем идёшь", "Подберём место под компанию", D.company, S.company, "company"); break;
      case "clearMood": S.mood = null; store.set("mood", null); render(); break;
      case "changeLoc": locSheet(); break;
      case "locate": closeSheet(); locate(); break;
      case "cnt-": S.plan.count = Math.max(2, S.plan.count - 1); haptic("select"); render(); break;
      case "cnt+": S.plan.count = Math.min(5, S.plan.count + 1); haptic("select"); render(); break;
      case "buy": haptic("light"); toast("Оплата через Telegram Stars подключится на следующем шаге"); break;
      case "resetLimits": store.set("usage", { day: today(), s: 0, r: 0 }); closeSheet(); render(); toast("Лимиты сброшены"); break;
      case "resetDemo":
        ["usage", "saved", "routes", "seen", "stamps", "stats", "mood"].forEach(function (k) { try { localStorage.removeItem("vibe2:" + k); } catch (e) {} });
        S.saved = []; S.routes = []; S.seen = []; S.stamps = 0; S.stats = { evenings: 0, places: 0, km: 0 }; S.mood = null;
        render(); toast("Демо-данные сброшены"); break;
    }
  }

  function bind() {
    var root = document;
    root.querySelectorAll("#app [data-act], #barIn [data-act]").forEach(function (b) { b.onclick = function () { act(b.getAttribute("data-act")); }; });
    root.querySelectorAll("[data-nav]").forEach(function (b) {
      b.onclick = function () {
        var t = b.getAttribute("data-nav"); haptic("select");
        if (t === "plan1") { S.plan = newPlan(); S.tab = "plan1"; S.history = []; S.screen = "plan1"; render(); window.scrollTo(0, 0); return; }
        go(t);
      };
    });
    root.querySelectorAll("#app [data-place]").forEach(function (b) { b.onclick = function () { S.current = place(b.getAttribute("data-place")); S.note = ""; haptic("light"); go("place"); }; });
    root.querySelectorAll("#app [data-mood]").forEach(function (b) {
      b.onclick = function () { var id = b.getAttribute("data-mood"); S.mood = S.mood === id ? null : id; store.set("mood", S.mood); haptic("select"); render(); };
    });
    root.querySelectorAll("#app [data-pmood]").forEach(function (b) {
      b.onclick = function () { var id = b.getAttribute("data-pmood"), m = S.plan.moods, i = m.indexOf(id); if (i >= 0) m.splice(i, 1); else m.push(id); haptic("select"); render(); };
    });
    root.querySelectorAll("#app [data-pcomp]").forEach(function (b) { b.onclick = function () { S.plan.company = b.getAttribute("data-pcomp"); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-ptime]").forEach(function (b) { b.onclick = function () { S.plan.time = b.getAttribute("data-ptime"); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-pbud]").forEach(function (b) { b.onclick = function () { S.plan.budget = b.getAttribute("data-pbud"); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-pfin]").forEach(function (b) { b.onclick = function () { S.plan.finish = b.getAttribute("data-pfin"); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-loc]").forEach(function (b) { b.onclick = function () { S.loc = b.getAttribute("data-loc"); store.set("loc", S.loc); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-swap]").forEach(function (b) { b.onclick = function () { swap(+b.getAttribute("data-swap")); }; });
    root.querySelectorAll("#app [data-seg]").forEach(function (b) { b.onclick = function () { S.savedTab = b.getAttribute("data-seg"); haptic("select"); render(); }; });
    root.querySelectorAll("#app [data-openroute]").forEach(function (b) {
      b.onclick = function () { var id = b.getAttribute("data-openroute"); S.route = S.routes.filter(function (r) { return r.id === id; })[0]; recalc(S.route); go("route"); };
    });
    var q = $("pq"); if (q) q.oninput = function () { S.plan.q = q.value.trim(); };
    var e = $("pend"); if (e) e.onchange = function () { var p = e.value.split(":"); if (p.length === 2) S.plan.endBy = +p[0] * 60 + +p[1]; };
    bindSlider(); bindSwipe(); bindGallery(); loadVisiblePhotos();
  }

  if (tg && tg.BackButton) { try { tg.BackButton.onClick(back); } catch (e) {} }

  /* ================= загрузка ================= */
  function fallback() {
    $("nav").hidden = true; $("bar").hidden = true;
    $("app").innerHTML = '<div class="glass fallback"><div class="round">' + ic("pin") + '</div><h2>Места не загрузились</h2>' +
      '<p>Похоже, пропал интернет или файл с местами временно недоступен. Попробуй ещё раз через пару секунд.</p>' +
      '<button class="btn gloss" id="retry">' + ic("refresh") + ' Обновить</button></div>';
    $("retry").onclick = function () { haptic("light"); load(); };
  }
  function load() {
    fetch("data.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.places || !d.places.length) throw new Error("empty");
        D = d;
        if (!byId(D.districts, S.loc)) S.loc = D.districts[0].id;
        render();
      })
      .catch(fallback);
  }
  load();
})();
</script>
</body>
</html>
